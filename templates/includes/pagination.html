{% load i18n %}
{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="{% translate '分页' %}">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">{% translate '上一页' %}</a>{% else %}<span>{% translate '上一页' %}</span>{% endif %}
  <strong>{{ page.number }} / {{ page.paginator.num_pages }}</strong>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}">{% translate '下一页' %}</a>{% else %}<span>{% translate '下一页' %}</span>{% endif %}
</nav>
{% endif %}
